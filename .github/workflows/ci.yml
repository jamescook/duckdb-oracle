name: CI

# Automatic on pull requests and non-main pushes, or by hand. Zig 0.17 only; the 0.15.2 compatibility check is the manual zig-0.15.yml.
on:
  push:
    # Not run automatically on main for now. Remove this filter to bring the push trigger back.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build all platforms and test (Zig 0.17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe -> extension version in the footer
      - uses: ./.github/actions/build-test
        with:
          zig-version: 0.17.0
          upload-artifacts: 'true'
