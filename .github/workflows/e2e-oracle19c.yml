name: E2E Oracle 19c (self-hosted)

# Manual and owner-only. Runs the real-database end-to-end tests (test/e2e, through test-windows.ps1) against the
# Oracle 19c database on the maintainer's own Windows machine. Everything about the database comes from that
# machine, not from this repository:
#   ORACLE_DSN, ORACLE_USER    the runner's environment (its .env file), see docs/SELF_HOSTED_RUNNER.md
#   ORACLE_CONTAINER           optional, the runner's environment: a container to `docker start` first
#   ORACLE_PASSWORD            the repository secret of the same name, passed ONLY as an environment variable
# There are deliberately no push or pull_request triggers: a self-hosted runner must never run code from
# someone else's pull request, and the job is locked to the repository owner.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to find the latest successful ci.yml run and download its artifact

# one run at a time: they share one database
concurrency:
  group: e2e-oracle19c
  cancel-in-progress: false

jobs:
  e2e:
    name: Real Oracle 19c end-to-end tests
    if: github.actor == 'jamescook' && github.repository_owner == 'jamescook'
    runs-on: [self-hosted, windows, oracle19c]
    timeout-minutes: 45
    steps:
      - name: Check the runner configuration and the secret
        shell: powershell
        env:
          # only whether the secret exists: this expression never contains its value
          ORACLE_PASSWORD_IS_SET: ${{ secrets.ORACLE_PASSWORD != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($name in 'ORACLE_DSN', 'ORACLE_USER') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            Write-Host ("::error title=Runner is not configured::The runner's environment is missing: {0}. Add the missing variable(s) to the .env file in the runner folder and restart the runner service (see docs/SELF_HOSTED_RUNNER.md)." -f ($missing -join ', '))
            exit 1
          }
          if ($env:ORACLE_PASSWORD_IS_SET -ne 'true') {
            Write-Host '::error title=Secret is missing::The repository secret ORACLE_PASSWORD is not set (Settings > Secrets and variables > Actions).'
            exit 1
          }
          # This repository's job logs are public: keep the database address and the account name out of them. The mask
          # applies to every later step of the job too, including everything test-windows.ps1 prints.
          Write-Host ('::add-mask::' + $env:ORACLE_DSN)
          Write-Host ('::add-mask::' + $env:ORACLE_USER)
          Write-Host 'ORACLE_DSN       : set (masked in this log)'
          Write-Host 'ORACLE_USER      : set (masked in this log)'
          Write-Host 'ORACLE_PASSWORD  : from the repository secret (not shown)'
          Write-Host ('ORACLE_CONTAINER : ' + $(if ($env:ORACLE_CONTAINER) { $env:ORACLE_CONTAINER } else { '(not set)' }))

      # Uses the image already on this machine: no pull, no registry login, ever.
      - name: Start the Oracle container, if ORACLE_CONTAINER is set
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ORACLE_CONTAINER) { Write-Host 'ORACLE_CONTAINER is not set: not starting a container.'; exit 0 }
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            Write-Host '::error title=docker not found::ORACLE_CONTAINER is set but docker is not on this runner''s PATH. Unset ORACLE_CONTAINER if the database runs elsewhere.'
            exit 1
          }
          $ErrorActionPreference = 'Continue'   # docker writes progress to stderr
          $out = (& docker start $env:ORACLE_CONTAINER 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host $out
          if ($code -ne 0 -and $out -notmatch 'already running|is already') {
            Write-Host ("::error title=docker start failed::docker start {0} exited with {1}" -f $env:ORACLE_CONTAINER, $code)
            exit 1
          }

      - uses: actions/checkout@v4

      # 1. The windows_amd64 build comes from the latest successful ci.yml run on main, so Zig is not needed here.
      #    This binary is loaded into duckdb.exe on a machine that holds database credentials, so only a build of a
      #    commit that is on main may be chosen. "branch=main" alone is not enough: a pull request from a fork whose
      #    branch is also called main reports head_branch = main, and so does a tag called main. Hence the event,
      #    the head repository and the compare check below.
      - name: Find the latest successful ci.yml run on main that has the windows_amd64 artifact
        id: ci-run
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $runs = Invoke-RestMethod -Headers $h -Uri "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=20"
          $runId = $null; $sha = $null
          foreach ($run in @($runs.workflow_runs)) {
            if ($run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
              Write-Host "Skipping run $($run.id): not a push to main of this repository."
              continue
            }
            $cmp = Invoke-RestMethod -Headers $h -Uri "$api/compare/main...$($run.head_sha)"
            if (@('identical', 'behind') -notcontains $cmp.status) {
              Write-Host "Skipping run $($run.id): commit $($run.head_sha) is not on main (compare status: $($cmp.status))."
              continue
            }
            $arts = Invoke-RestMethod -Headers $h -Uri "$api/actions/runs/$($run.id)/artifacts?per_page=100"
            $hit = @($arts.artifacts | Where-Object { $_.name -eq 'duckdb_oracle-windows_amd64' -and -not $_.expired })
            if ($hit.Count -gt 0) { $runId = $run.id; $sha = $run.head_sha; break }
          }
          if (-not $runId) {
            Write-Host '::error title=No build to test::There is no successful ci.yml run on main with an unexpired duckdb_oracle-windows_amd64 artifact. Run ci.yml on main first (and let it pass).'
            exit 1
          }
          Write-Host "Using ci.yml run $runId (commit $sha)"
          if ($sha -ne $env:GITHUB_SHA) { Write-Host "::notice::The extension is from main commit $sha; the tests and scripts are from $env:GITHUB_SHA." }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "run_id=$runId" -Encoding ascii

      - name: Download the windows_amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: duckdb_oracle-windows_amd64
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      # 2-6: downloads the pinned official DuckDB CLI and verifies its SHA-256 (no other DuckDB is used), checks that
      # a 64-bit oci.dll is first on PATH, LOADs the extension under its exact shipped file name and prints
      # oracle_client_info(), waits up to 5 minutes for the database, then runs every test/e2e/*.sql. -Strict makes any
      # skipped or warned step a failure. The password reaches the process only through the environment.
      - name: Run the end-to-end tests (test-windows.ps1 -Strict)
        shell: powershell
        env:
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'artifacts\duckdb_oracle-windows_amd64.zip'
          if (-not (Test-Path -LiteralPath $zip)) {
            Write-Host "::error title=Artifact missing::$zip was not downloaded."
            exit 1
          }
          $code = 1
          try {
            & .\test-windows.ps1 -Extension $zip -Strict -WaitForDatabase 300 -TimeoutSeconds 180
            $code = $LASTEXITCODE
          } catch {
            Write-Host ("::error title=test-windows.ps1 aborted::{0}" -f $_.Exception.Message)
          }
          Write-Host ('final exit code: {0} (0x{1:X8})' -f $code, $code)
          exit $code
